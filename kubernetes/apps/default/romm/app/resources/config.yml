---
exclude:
  platforms:
    - "@eaDir"
  roms:
    single_file:
      extensions:
        - dat
        - nfo
        - txt
        - xml
      names:
        - "._*"
        - "@eaDir"
    multi_file:
      names:
        - "@eaDir"
scan:
  priority:
    metadata:
      - "hasheous"
      - "playmatch"
      - "igdb"
      - "launchbox"
      - "ss"
      - "ra"
      - "hltb"
    artwork:
      - "ss"
      - "launchbox"
      - "igdb"
filesystem:
  structure:
    default: "roms/{platform}/{game}"
    firmware: "bios/{platform}"
# Map folder names to RomM platform slugs where they don't auto-detect
system:
  platforms: {}
  versions: {}
