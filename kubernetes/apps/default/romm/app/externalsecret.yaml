---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: romm
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: romm-secret
    template:
      engineVersion: v2
      data:
        ROMM_AUTH_SECRET_KEY: "{{ .ROMM_AUTH_SECRET_KEY }}"
        IGDB_CLIENT_ID: "{{ .IGDB_CLIENT_ID }}"
        IGDB_CLIENT_SECRET: "{{ .IGDB_CLIENT_SECRET }}"
        STEAMGRIDDB_API_KEY: "{{ .STEAMGRIDDB_API_KEY }}"
        RETROACHIEVEMENTS_API_KEY: "{{ .RETROACHIEVEMENTS_API_KEY }}"
        SCREENSCRAPER_USER: "{{ .SCREENSCRAPER_USER }}"
        SCREENSCRAPER_PASSWORD: "{{ .SCREENSCRAPER_PASSWORD }}"
        DB_HOST: &dbHost postgres16-rw.database-system.svc.cluster.local
        DB_PORT: "5432"
        DB_USER: &dbUser "{{ .ROMM_POSTGRES_USER }}"
        DB_PASSWD: &dbPass "{{ .ROMM_POSTGRES_PASSWORD }}"
        DB_NAME: &dbName romm_main
        INIT_POSTGRES_DBNAME: *dbName
        INIT_POSTGRES_HOST: *dbHost
        INIT_POSTGRES_USER: *dbUser
        INIT_POSTGRES_PASS: *dbPass
        INIT_POSTGRES_SUPER_PASS: "{{ .POSTGRES_SUPER_PASS }}"
  dataFrom:
    - extract:
        key: romm
    - extract:
        key: cloudnative-pg

